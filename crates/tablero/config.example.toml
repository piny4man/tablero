# ARC Raiders-inspired field terminal preset for tablero.
#
# Copy to `$XDG_CONFIG_HOME/tablero/config.toml` (or
# `~/.config/tablero/config.toml`) and restart tablero. This is an opinionated
# desktop loadout, not the built-in default configuration. Any omitted field
# still falls back to tablero's built-in value.
#
# Colors accept "#rrggbb" or "#rrggbbaa". This preset follows the shared ARC
# Raiders palette: purple-black surfaces, warm cream text, cyan focus, rainbow
# semantic accents, and translucent state fills.

height = 38

[bar]
background = "#00000000"
margin = 4
gap = 4
modules-left = ["workspaces", "title"]
modules-center = []
modules-right = [
  "updates",
  "bluetooth",
  "backlight",
  "volume",
  "system",
  "network",
  "tray",
  "notifications",
  "battery",
  "power-profiles-daemon",
  "clock",
]

[theme]
background = "#140917"
foreground = "#eae2cf"
accent = "#7decff"

[font]
# Install this Nerd Font for the intended compact telemetry look and glyphs.
# Remove `family` to use the system default if it is unavailable.
family = "JetBrainsMono Nerd Font"
size = 15.0

# Workspace cells are the strongest signal: purple-black equipment keys with a
# cyan active slab. A two-pixel radius keeps them machined, not pillowy.
[widget.workspaces]
background = "#1c0e1ee8"
foreground = "#9a8a98"
accent = "#7decff"
border = "#3d1f3a"
border-width = 1
radius = 2

# The focused mission context follows the workspaces as a single left-side strip.
# Its quieter outline separates context from the cyan selection without making
# the title compete with live alerts.
[widget.title]
background = "#1c0e1ee8"
foreground = "#eae2cf"
border = "#2a1428"
border-width = 1
radius = 2
padding = 12
icon = "none"

[widget.tray]
background = "#1c0e1ee8"
foreground = "#eae2cf"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 6

[widget.tray.attention]
background = "#f7080b30"
foreground = "#ff4a4d"
border = "#f7080b"

# Hidden when the machine is current. checkupdates supplies official repository
# updates; when paru is installed its pending AUR updates are added to the count.
[widget.updates]
background = "#1c0e1ee8"
foreground = "#f9cf07"
border = "#f9cf07"
border-width = 1
radius = 2
padding = 6
format = "{icon} {count}"
# on-click = "/path/to/update-system"

[widget.notifications]
background = "#1c0e1ee8"
foreground = "#eae2cf"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8

[widget.notifications.attention]
background = "#f7080b30"
foreground = "#ff4a4d"
border = "#f7080b"

[widget.bluetooth]
background = "#1c0e1ee8"
foreground = "#7decff"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8
# on-click = "/usr/bin/blueman-manager"

[widget.backlight]
background = "#1c0e1ee8"
foreground = "#f9cf07"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8
format = "{icon} {percent}%"
scroll-step = 5

[widget.battery]
background = "#1c0e1ee8"
foreground = "#f5c70f"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8
format = "{icon} {percent}%"
warn-threshold = 20

[widget.battery.warn]
background = "#f7080b30"
foreground = "#ff4a4d"
border = "#f7080b"

# Charging is unmistakable without spelling it out: bolt + percentage, green
# telemetry, a crisp success border, and a low-alpha green surface.
[widget.battery.charging]
background = "#2df18520"
foreground = "#5ff5a0"
border = "#2df185"

[widget.volume]
background = "#1c0e1ee8"
foreground = "#eae2cf"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8
# on-click = "/usr/bin/pavucontrol"

[widget.network]
background = "#1c0e1ee8"
foreground = "#7decff"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8

[widget.system]
background = "#1c0e1ee8"
foreground = "#eae2cf"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8

[widget.clock]
background = "#1c0e1ee8"
foreground = "#f5f0e0"
border = "#7decff"
border-width = 1
radius = 2
padding = 10

[widget.power-profiles-daemon]
background = "#1c0e1ee8"
foreground = "#f5c70f"
border = "#3d1f3a"
border-width = 1
radius = 2
padding = 8
format = "{icon} {profile}"
tooltip = true
tooltip-format = "POWER MODE: {profile}\nDRIVER: {driver}"

[widget.power-profiles-daemon.format-icons]
default = ""
performance = ""
balanced = ""
power-saver = ""

