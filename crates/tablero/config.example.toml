# tablero configuration — every value below is the built-in default.
#
# Copy this file to `$XDG_CONFIG_HOME/tablero/config.toml` (or
# `~/.config/tablero/config.toml`) and edit only what you want to change: the
# file may be partial, and any omitted field falls back to the default shown
# here. An unknown key, an unknown widget name, or a malformed color is a hard
# error — tablero refuses to start rather than silently ignoring it.

# Bar height in pixels. The width always spans the output.
height = 32

# Horizontal gap between adjacent widget columns, in pixels.
spacing = 0

# Inner padding inset on each widget column, in pixels.
padding = 0

# Widgets to render, left to right. Valid names: "workspaces", "clock",
# "battery", "system", "network", "tray". "tray" shows StatusNotifierItem
# system-tray icons from background apps and is opt-in — add it to enable it,
# e.g. ["workspaces", "clock", "battery", "system", "network", "tray"]. Repeats
# are de-duplicated, keeping first position.
widgets = ["workspaces", "clock", "battery", "system", "network"]

[theme]
# Colors are "#rrggbb" hex strings (the leading "#" is optional).
background = "#181818" # fill behind every widget
foreground = "#eaeaea" # default text color
accent     = "#eaeaea" # emphasis color (e.g. the active workspace)

[font]
# family is unset by default, which uses the system default font. Uncomment to
# pick a specific family:
# family = "JetBrains Mono"
size = 16.0
