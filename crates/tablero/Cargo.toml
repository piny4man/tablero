[package]
name = "tablero"
version = "0.6.0"
edition = "2024"
authors = ["piny4man <development@pinya.dev>"]
description = "A fast, native Wayland status bar for Hyprland"
license = "GPL-3.0-only"
repository = "https://github.com/piny4man/tablero"
homepage = "https://github.com/piny4man/tablero"
readme = "../../README.md"
keywords = ["wayland", "hyprland", "status-bar", "desktop", "linux"]
categories = ["gui", "visualization"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "examples/**", "config.example.toml", "LICENSE"]

[dependencies]
swatches = "0.1.0"
# default-features = false drops the regex filter engine, the `jiff` datetime
# stack, and anstream/anstyle coloring — none of which a plain `env_logger::init()`
# needs. RUST_LOG level/module filtering still works.
env_logger = { version = "0.11", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cosmic-text = { version = "0.19", default-features = false, features = ["swash", "std"] }
# Reads one character map per face for icon-glyph fallback (see src/fallback.rs);
# already in the tree through fontdb.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
toml = "0.8"
log = "0.4"
smithay-client-toolkit = { version = "0.20", features = ["calloop"] }
wayland-client = "0.31"
calloop = "0.14"
calloop-wayland-source = "0.4"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "time",
  "net",
  "io-util",
  "sync",
  "fs",
  "process",
] }
serde_json = "1"
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
pipewire = "0.9"
udev = "0.9.3"
mio = { version = "1", features = ["os-poll", "os-ext"] }
nix = { version = "0.30", features = ["signal"] }
rustix = { version = "1", features = ["fs", "process"] }
# Profiling instrumentation. Every macro is a no-op and none of hotpath's own
# dependencies are compiled unless the `hotpath` feature below is enabled; the
# `tokio` feature only names the Tokio channel types the bar already uses.
hotpath = { version = "0.28", default-features = false, features = ["tokio"] }

[features]
# Opt-in profiling: `cargo run --release --features hotpath[,hotpath-alloc]`
# prints a timing (and allocation) report when the bar exits. See
# docs/hotpath-profiling.md.
hotpath = ["hotpath/hotpath", "hotpath/threads"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
