[package]
name = "tablero-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cosmic-text = { version = "0.19", default-features = false, features = ["swash", "std"] }
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
