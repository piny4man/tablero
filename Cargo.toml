[workspace]
members = [
    "crates/tablero",
    "crates/tablero-core",
    "crates/tablero-wayland",
]
resolver = "2"

# Size-optimized release build. The bar is a long-running daemon whose render
# path is light, so we trade a little compile time (and unwinding panics) for the
# smallest possible binary. Dev/test builds are unaffected — they keep the
# default unwinding panics and backtraces.
[profile.release]
opt-level = "z"     # optimize for size over speed
lto = true          # fat link-time optimization across the whole graph
codegen-units = 1   # maximum cross-unit optimization (slower compile)
panic = "abort"     # drop unwind tables; a panic aborts the process
strip = true        # strip symbols and debuginfo from the binary
